apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'   // Compose 编译器随 Kotlin 发行（Liquid Glass Tab）
// apply plugin: 'com.chaquo.python'  // Temporarily disabled - network issue downloading bootstrap

android {
    namespace 'com.hydro.link.server'
    // backdrop(liquid glass) 的 AAR 要求 minCompileSdk=37；AGP 8.7.3 最高建议 35，
    // 超出部分由 gradle.properties 的 android.suppressUnsupportedCompileSdk=37 压掉
    compileSdk 37

    defaultConfig {
        applicationId "com.hydro.link"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.2.2"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file('hydrolink-release.keystore')
            storePassword 'hydrostation'
            keyAlias 'hydro'
            keyPassword 'hydrostation'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
        aidl true
    }
}

// 单测会在**运行时**读这些文件（真胶水 worker.js、宿主页 worker.html、示例 .hpk），
// Gradle 默认看不见它们：不声明的话改了胶水、测试任务照样显示 UP-TO-DATE —— 刚才
// 就真的踩到了（把 script src 改回相对路径，测试"全绿"其实是一次都没跑）。
tasks.withType(Test).configureEach {
    inputs.dir(file('src/main/assets/hydrokit'))
        .withPropertyName('hydrokitAssets')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree('../../desktop/examples') { include '*.hpk' })
        .withPropertyName('examplePackages')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .optional(true)
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // activity 1.13.0：ComponentActivity 实现 NavigationEventDispatcherOwner 并把它挂到
    // window decor 的 ViewTree 上。miuix 的 WindowDialog 内部用 NavigationBackHandler，
    // 靠这个 Owner 解析；1.8.0 时代没有它，一点「添加命令 / root 开关」就崩
    // （IllegalStateException: No NavigationEventDispatcher was provided...）。
    // 版本与 InstallerX-Revived 的 activity-compose 1.13.0 保持一致；activity-compose
    // 顺带提供 BackHandler（权限页返回键拦截）。
    implementation 'androidx.activity:activity-compose:1.13.0'
    // 真正的导航返回栈：miuix 界面用 NavHost 管 Tab 与权限页，返回键/转场由 NavController 负责
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // Shizuku（授权器可选「Shizuku」；Apache-2.0）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // 底部 Tab 栏 Liquid Glass 效果（Kyant0/AndroidLiquidGlass，Maven Central）。
    // backdrop 对 compose 只声明了 runtime scope——自己代码要用 Compose 必须显式带上
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes-android:1.2.1'
    implementation 'org.jetbrains.compose.foundation:foundation-android:1.12.0'
    implementation 'org.jetbrains.compose.ui:ui-android:1.12.0'
    // MD3 界面引擎（Compose Material3，和 InstallerX 同一套组件：ListItem/Switch/
    // SegmentedColumn/LargeFlexibleTopAppBar）
    implementation 'org.jetbrains.compose.material3:material3:1.12.0-alpha03'
    // 动态配色：Expressive 2025 规格 + Tonal Spot 调色板（InstallerX 同款 materialkolor）
    implementation 'com.materialkolor:material-kolor:5.0.1'

    // miuix（MIUI/HyperOS 风格 Compose 组件库，Apache-2.0）：设置里的开关控制启用；
    // 刻意不加 miuix-blur —— 它要 minSdk 33，本项目 minSdk 24
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    // WindowSpinnerPreference（UI 引擎下拉，InstallerX 同款设置组件）
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    // 悬浮底栏的玻璃/模糊（Apache-2.0 的 miuix blur；AAR 声明 minSdk 33，
    // 用 manifest 的 overrideLibrary 兜住，运行时只在 API 33+ 启用，低版本退化为纯色胶囊）
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'
    // XMS Wearable SDK for interconnect (included as AAR in libs/)

    // HydroKit 原生网络能力（JSch pure Java SSH 支持）
    implementation 'com.github.mwiede:jsch:0.2.23'

    // Google ML Kit 离线手写识别引擎
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'

    // HydroKit 的协议/运行时/存储等纯逻辑放在 JVM 单测里跑（不依赖 Android API）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

