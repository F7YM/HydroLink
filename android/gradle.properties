android.useAndroidX=true
# AGP 9 默认启用内置 Kotlin + 新 DSL，两者都与现有 kotlin-android 插件不兼容；
# 两个逃生门都关掉（opt-out 在 AGP 10 才移除，我们锁定 9.1.1），保住 KGP 2.4.10 结构
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.java.home=/usr/lib/jvm/java-21-temurin-jdk
# R8/D8 合并 dex 需要内存；加了 material3 后默认堆会 OOM（mergeExtDexRelease
# java.lang.OutOfMemoryError: Java heap space）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

