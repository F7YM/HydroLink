<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌搭</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, "Noto Sans CJK SC", sans-serif; background: #121318; color: #e8eaf0; padding: 24px; max-width: 560px; }
    h1 { font-size: 18px; margin-bottom: 6px; }
    p.hint { color: #9aa2b1; font-size: 12px; line-height: 1.6; margin-bottom: 16px; }
    .card { background: #1d1f27; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    label { flex: 0 0 132px; font-size: 13px; color: #bac3ff; }
    input[type=range] { flex: 1; }
    input[type=number] { width: 84px; padding: 6px 8px; border-radius: 8px; border: 1px solid #3a3f4c; background: #121318; color: #fff; }
    button { cursor: pointer; border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 700; background: #bac3ff; color: #00237c; margin-right: 8px; }
    button.ghost { background: transparent; color: #bac3ff; border: 1px solid #3a3f4c; }
    #msg { margin-top: 10px; font-size: 13px; color: #7ddc9a; min-height: 18px; white-space: pre-line; }
    .val { font-size: 12px; color: #9aa2b1; width: 46px; text-align: right; }

    /* SPlayer 开关：原生 checkbox 深色下不可读，自己画一个 */
    .switch { flex: 0 0 auto; display: inline-flex; align-items: center; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track {
      width: 46px; height: 26px; border-radius: 13px; background: #3a3f4c;
      transition: background .15s; position: relative;
    }
    .switch .track::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #9aa2b1; transition: transform .15s, background .15s;
    }
    .switch input:checked + .track { background: #bac3ff; }
    .switch input:checked + .track::after { transform: translateX(20px); background: #00237c; }
    #splayerState { font-size: 12px; color: #9aa2b1; line-height: 1.6; white-space: pre-line; margin: 0; }
    #splayerState.on { color: #7ddc9a; }
  </style>
</head>
<body>
  <h1>桌搭</h1>

  <div class="card">
    <div class="row"><label>字体缩放</label><input type="range" id="fontScale" min="0.6" max="2" step="0.1"><span class="val" id="fontScaleV"></span></div>
    <div class="row"><label>背景模糊 px</label><input type="range" id="blur" min="0" max="60" step="1"><span class="val" id="blurV"></span></div>
    <div class="row"><label>背景亮度 %</label><input type="range" id="dim" min="5" max="100" step="5"><span class="val" id="dimV"></span></div>
    <button id="save">保存</button>
    <button id="reset" class="ghost">恢复默认</button>
    <p id="msg"></p>
  </div>

  <!-- 只在桌面端（Windows/Linux/macOS）显示：安卓端没有本地 SPlayer -->
  <div class="card" id="splayerCard" hidden>
    <div class="row">
      <label>SPlayer 歌词集成</label>
      <label class="switch"><input type="checkbox" id="splayerLyrics"><span class="track"></span></label>
    </div>
    <div class="row">
      <label>WebSocket 端口</label>
      <input type="number" id="splayerPort" min="1" max="65535" step="1">
    </div>
    <p id="splayerState"></p>
    <p class="hint" style="margin: 10px 0 0">需要 SPlayer 3.0 及以上版本，并在「设置 → 服务」里打开 WebSocket 服务（默认端口 25885）。开启后桌搭会显示实时歌词。</p>
  </div>

  <script>
    var PKG = 'com.hydro.deskbuddy';
    var DEFAULTS = { fontScale: 1, blur: 26, dim: 30 };
    // 只有这些系统上才可能有本地 SPlayer
    var SP_PLATFORMS = ['linux', 'darwin', 'windows'];

    function $(id) { return document.getElementById(id); }
    function msg(t) { $('msg').textContent = t; }
    async function store(op, key, value) {
      var r = await fetch('/api/hydro/worker/store', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ package: PKG, op: op, key: key, value: value })
      });
      return r.json();
    }
    function bind(id, fmt) {
      var el = $(id);
      el.addEventListener('input', function () { $(id + 'V').textContent = fmt ? fmt(el.value) : el.value; });
    }
    bind('fontScale'); bind('blur'); bind('dim', function (v) { return v + '%'; });

    async function load() {
      for (var k in DEFAULTS) {
        var d = await store('get', k);
        var v = (d && d.found) ? d.value : DEFAULTS[k];
        if (k === 'dim') v = Math.round(v * 100);
        var el = $(k);
        if (!el) continue;
        if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
        el.dispatchEvent(new Event('input'));
      }
    }
    function collect() {
      return {
        fontScale: Number($('fontScale').value),
        blur: Number($('blur').value),
        dim: Number($('dim').value) / 100
      };
    }
    $('save').addEventListener('click', async function () {
      var s = collect();
      for (var k in s) await store('set', k, s[k]);
      msg('保存成功');
    });
    $('reset').addEventListener('click', async function () {
      for (var k in DEFAULTS) await store('remove', k);
      await load();
      msg('已恢复默认。');
    });

    // ---- SPlayer 歌词集成 ----

    var SP_DEFAULT_PORT = 25885;

    /** 宿主平台：安卓端没有这个能力，整块卡片不显示。 */
    async function hostOS() {
      try {
        var r = await fetch('/api/hydro/worker/platform');
        if (!r.ok) return '';
        var d = await r.json();
        return (d && d.os) || '';
      } catch (e) { return ''; }
    }

    function spState(text, on) {
      var el = $('splayerState');
      el.textContent = text;
      el.className = on ? 'on' : '';
    }

    /** 开关与端口是自己这两个存储键（宿主读它们决定连不连 SPlayer）。 */
    async function spLoad() {
      var on = await store('get', 'splayerLyrics');
      $('splayerLyrics').checked = !!(on && on.found && on.value);
      var port = await store('get', 'splayerPort');
      var p = (port && port.found) ? Number(port.value) : SP_DEFAULT_PORT;
      $('splayerPort').value = (p > 0 && p < 65536) ? p : SP_DEFAULT_PORT;
    }

    /**
     * 连接是插件自己的事（它用 kit.ws 直连 SPlayer），所以状态由插件写进
     * 自己的存储、这里读出来显示。
     */
    async function spStatus() {
      if ($('splayerCard').hidden) return;
      if (!$('splayerLyrics').checked) {
        spState('已关闭。开启后桌搭会显示 SPlayer 的实时歌词。', false);
        return;
      }
      var d = await store('get', 'splayerState').catch(function () { return null; });
      var st = (d && d.found) ? d.value : null;
      if (!st) {
        spState('还没有状态：在手表上打开一次桌搭，插件就会开始连接。', false);
        return;
      }
      if (!st.connected) {
        spState('未连接。请确认 SPlayer 正在运行，且 WebSocket 服务已在 ' +
          (st.port || $('splayerPort').value) + ' 端口开启。' +
          (st.error ? '\n' + st.error : ''), false);
        return;
      }
      var track = st.title ? st.title + (st.artist ? ' — ' + st.artist : '') : '没有正在播放的歌曲';
      spState('已连接 · ' + track + (st.line ? '\n' + st.line : ''), true);
    }

    /**
     * 插件只在有请求时才会跑；设置页开着的时候戳一下视图端点，
     * 好让连接在这一页就能建起来（顺带在 SPlayer 重开后自动重连）。
     */
    function spPoke() {
      fetch('/api/hydro/' + PKG + '/app/main/view?shape=circle&width=466&height=466&dpr=2&dt=watch')
        .catch(function () {});
    }

    $('splayerLyrics').addEventListener('change', async function () {
      await store('set', 'splayerLyrics', this.checked);
      msg(this.checked ? '已开启 SPlayer 歌词集成' : '已关闭 SPlayer 歌词集成');
      if (this.checked) spPoke();
      spStatus();
    });
    $('splayerPort').addEventListener('change', async function () {
      var p = Math.max(1, Math.min(65535, Number(this.value) || SP_DEFAULT_PORT));
      this.value = p;
      await store('set', 'splayerPort', p);
      spStatus();
    });

    (async function init() {
      await load();
      if (SP_PLATFORMS.indexOf(await hostOS()) < 0) return;
      $('splayerCard').hidden = false;
      await spLoad();
      spStatus();
      if ($('splayerLyrics').checked) spPoke();
      setInterval(spStatus, 1000);
      setInterval(function () { if ($('splayerLyrics').checked) spPoke(); }, 5000);
    })();
  </script>
</body>
</html>
