<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌搭 · 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, "Noto Sans CJK SC", sans-serif; background: #121318; color: #e8eaf0; padding: 24px; max-width: 560px; }
    h1 { font-size: 18px; margin-bottom: 6px; }
    p.hint { color: #9aa2b1; font-size: 12px; line-height: 1.6; margin-bottom: 16px; }
    .card { background: #1d1f27; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    label { flex: 0 0 132px; font-size: 13px; color: #bac3ff; }
    input[type=range] { flex: 1; }
    input[type=number] { width: 84px; padding: 6px 8px; border-radius: 8px; border: 1px solid #3a3f4c; background: #121318; color: #fff; }
    select { padding: 6px 8px; border-radius: 8px; border: 1px solid #3a3f4c; background: #121318; color: #fff; }
    button { cursor: pointer; border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 700; background: #bac3ff; color: #00237c; margin-right: 8px; }
    button.ghost { background: transparent; color: #bac3ff; border: 1px solid #3a3f4c; }
    #msg { margin-top: 10px; font-size: 13px; color: #7ddc9a; min-height: 18px; white-space: pre-line; }
    .val { font-size: 12px; color: #9aa2b1; width: 46px; text-align: right; }
  </style>
</head>
<body>
  <h1>桌搭 · 设置</h1>
  <p class="hint">弧条与背景的调参项存在服务端存储，手表上 3 秒内生效（表盘刷新周期）。左弧=CPU，右弧=RAM。</p>

  <div class="card">
    <div class="row"><label>距边缘 (物理px)</label><input type="range" id="edgeGap" min="4" max="60" step="1"><span class="val" id="edgeGapV"></span></div>
    <div class="row"><label>弧长 (度)</label><input type="range" id="arcSpan" min="20" max="120" step="5"><span class="val" id="arcSpanV"></span></div>
    <div class="row"><label>粗细 (物理px)</label><input type="range" id="stroke" min="2" max="24" step="1"><span class="val" id="strokeV"></span></div>
    <div class="row"><label>背景模糊 px</label><input type="range" id="blur" min="0" max="60" step="1"><span class="val" id="blurV"></span></div>
    <div class="row"><label>背景亮度 %</label><input type="range" id="dim" min="5" max="100" step="5"><span class="val" id="dimV"></span></div>
    <div class="row"><label>侧条样式</label>
      <select id="bars">
        <option value="bar">直条（默认，稳定可见）</option>
        <option value="arc">贴边弧线</option>
      </select>
    </div>
    <div class="row"><label>字体缩放</label><input type="range" id="fontScale" min="0.6" max="2" step="0.1"><span class="val" id="fontScaleV"></span></div>
    <div class="row"><label>配色</label>
      <select id="colors">
        <option value="gray">统一灰（贴合参考图）</option>
        <option value="split">区分色（CPU 紫 / RAM 绿）</option>
      </select>
    </div>
    <button id="save">保存</button>
    <button id="reset" class="ghost">恢复默认</button>
    <p id="msg"></p>
  </div>

  <script>
    var PKG = 'com.demo.deskbuddy';
    var DEFAULTS = { edgeGap: 16, arcSpan: 60, stroke: 9, blur: 26, dim: 30, fontScale: 1 };
    function $(id) { return document.getElementById(id); }
    function msg(t) { $('msg').textContent = t; }
    async function store(op, key, value) {
      var r = await fetch('/api/hydro/worker/store', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ package: PKG, op: op, key: key, value: value })
      });
      return r.json();
    }
    function bind(id, fmt) {
      var el = $(id);
      el.addEventListener('input', function () { $(id + 'V').textContent = fmt ? fmt(el.value) : el.value; });
    }
    bind('edgeGap'); bind('arcSpan'); bind('stroke'); bind('blur'); bind('fontScale');
    bind('dim', function (v) { return v + '%'; });

    async function load() {
      for (var k in DEFAULTS) {
        var d = await store('get', k);
        var v = (d && d.found) ? d.value : DEFAULTS[k];
        if (k === 'dim') v = Math.round(v * 100);
        var el = $(k);
        if (el) { el.value = v; el.dispatchEvent(new Event('input')); }
      }
      var c = await store('get', 'colors');
      $('colors').value = (c && c.found) ? c.value : 'gray';
      var b = await store('get', 'bars');
      $('bars').value = (b && b.found) ? b.value : 'bar';
    }
    function collect() {
      return {
        fontScale: Number($('fontScale').value),
        edgeGap: Number($('edgeGap').value),
        arcSpan: Number($('arcSpan').value),
        stroke: Number($('stroke').value),
        blur: Number($('blur').value),
        dim: Number($('dim').value) / 100
      };
    }
    $('save').addEventListener('click', async function () {
      var s = collect();
      for (var k in s) await store('set', k, s[k]);
      await store('set', 'colors', $('colors').value);
      await store('set', 'bars', $('bars').value);
      msg('已保存——手表 3 秒内生效。');
    });
    $('reset').addEventListener('click', async function () {
      for (var k in DEFAULTS) await store('remove', k);
      await store('remove', 'colors');
      await store('remove', 'bars');
      await load();
      msg('已恢复默认。');
    });
    load();
  </script>
</body>
</html>
