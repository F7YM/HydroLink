<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抖音控制器 - 配置与调试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0F0F14;
      color: #E8EAF0;
      padding: 24px;
      max-width: 540px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .pkg-tag {
      font-size: 11px;
      color: #8E919E;
      font-family: monospace;
      margin-top: 2px;
    }
    .card {
      background: #181A22;
      border: 1px solid #262936;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      color: #A0A5B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-main {
      grid-column: span 2;
      background: #FE2C55;
      color: #FFFFFF;
      font-size: 16px;
      padding: 14px;
    }
    .btn-main:hover {
      background: #e02449;
    }
    .btn-secondary {
      background: #242733;
      color: #E8EAF0;
    }
    .btn-secondary:hover {
      background: #2d3140;
    }
    .btn-like {
      background: #351824;
      color: #FE2C55;
      border: 1px solid #521c32;
    }
    .btn-like:hover {
      background: #441d2d;
    }
    .btn-toggle {
      background: #16282E;
      color: #25F4EE;
      border: 1px solid #1c3b44;
    }
    .btn-toggle:hover {
      background: #1d363e;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid #20222D;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #8E919E;
    }
    .info-val {
      color: #25F4EE;
      font-family: monospace;
    }
    #msg {
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
      color: #25F4EE;
      text-align: center;
      white-space: pre-line;
      line-height: 1.5;
    }
    .hint-box {
      background: #12131A;
      border-left: 3px solid #FE2C55;
      padding: 10px 14px;
      font-size: 12px;
      color: #A0A5B8;
      line-height: 1.6;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <img src="../assets/icon.png" alt="Icon" class="logo">
    <div>
      <h1>抖音控制器</h1>
      <div class="pkg-tag">com.float11.tiktok.control · v1.0.0</div>
    </div>
  </header>

  <div class="card">
    <h2>快捷动作调试</h2>
    <div class="btn-grid">
      <button class="btn-secondary" style="grid-column: span 2;" id="btnPrev">▲ 上一个视频</button>
      <button class="btn-main" id="btnNext">▼ 下一个视频 (向上滑)</button>
      <button class="btn-like" id="btnLike">❤️ 双击点赞</button>
      <button class="btn-toggle" id="btnToggle">⏯ 播放 / 暂停</button>
      <button class="btn-secondary" id="btnVolDown">🔉 音量 -</button>
      <button class="btn-secondary" id="btnVolUp">🔊 音量 +</button>
    </div>
    <div id="msg">就绪，点击上方按钮测试输入控制</div>
  </div>

  <div class="card">
    <h2>设备与屏幕状态</h2>
    <div class="info-row">
      <span class="info-label">屏幕分辨率</span>
      <span class="info-val" id="screenVal">未获取</span>
    </div>
    <div class="info-row">
      <span class="info-label">指针位置</span>
      <span class="info-val" id="cursorVal">未获取</span>
    </div>
    <div class="info-row">
      <span class="info-label">最近操作记录</span>
      <span class="info-val" id="lastActionVal">无记录</span>
    </div>
    <div style="margin-top: 12px;">
      <button class="btn-secondary" style="width: 100%;" id="btnRefreshStatus">刷新屏幕与存储状态</button>
    </div>
  </div>

  <div class="hint-box">
    <strong>💡 使用提示：</strong><br>
    • <strong>Android 手机</strong>：请先在系统设置中为 HydroLink 开启「无障碍服务」权限，以便执行屏幕滑动与点击。<br>
    • <strong>桌面端 (PC)</strong>：在系统弹出的权限提示中允许输入模拟，打开网页版抖音即可通过方向键与空格自动联动。
  </div>

  <script>
    var PKG = 'com.float11.tiktok.control';
    var cachedScreen = null;

    function setMsg(txt, isErr) {
      var el = document.getElementById('msg');
      el.textContent = txt;
      el.style.color = isErr ? '#FE2C55' : '#25F4EE';
    }

    async function req(url, body) {
      var r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ package: PKG }, body))
      });
      if (!r.ok) {
        var errTxt = await r.text();
        throw new Error('HTTP ' + r.status + ': ' + errTxt);
      }
      return r.json();
    }

    async function getScreen() {
      if (cachedScreen) return cachedScreen;
      var res = await req('/api/hydro/worker/input', { op: 'screen' });
      cachedScreen = res;
      return res;
    }

    async function refreshStatus() {
      try {
        var s = await req('/api/hydro/worker/input', { op: 'screen' });
        cachedScreen = s;
        document.getElementById('screenVal').textContent = (s && s.width && s.height) ? (s.width + ' × ' + s.height) : '未知';
      } catch (e) {
        document.getElementById('screenVal').textContent = '获取失败: ' + e.message;
      }

      try {
        var c = await req('/api/hydro/worker/input', { op: 'cursor' });
        document.getElementById('cursorVal').textContent = (c && c.x !== undefined) ? ('(' + c.x + ', ' + c.y + ')') : '未知';
      } catch (e) {
        document.getElementById('cursorVal').textContent = '未支持';
      }

      try {
        var st = await req('/api/hydro/worker/store', { op: 'get', key: 'last_action' });
        document.getElementById('lastActionVal').textContent = (st && st.found) ? st.value : '无记录';
      } catch (e) {}
    }

    async function doNext() {
      setMsg('正在切换下一个视频...');
      var s = await getScreen();
      var isDesktop = s.width >= s.height;
      if (isDesktop) {
        await req('/api/hydro/worker/input', { op: 'key', key: 'down' });
        setMsg('已发送按键: Down (下一个视频)');
      } else {
        var cx = Math.floor(s.width / 2);
        var y1 = Math.floor(s.height * 0.76);
        var y2 = Math.floor(s.height * 0.22);
        await req('/api/hydro/worker/input', { op: 'drag', x1: cx, y1: y1, x2: cx, y2: y2, duration: 240 });
        setMsg('已执行手势: 向上划动 (' + cx + ',' + y1 + ' → ' + cx + ',' + y2 + ')');
      }
      await refreshStatus();
    }

    async function doPrev() {
      setMsg('正在返回上一个视频...');
      var s = await getScreen();
      var isDesktop = s.width >= s.height;
      if (isDesktop) {
        await req('/api/hydro/worker/input', { op: 'key', key: 'up' });
        setMsg('已发送按键: Up (上一个视频)');
      } else {
        var cx = Math.floor(s.width / 2);
        var y1 = Math.floor(s.height * 0.22);
        var y2 = Math.floor(s.height * 0.76);
        await req('/api/hydro/worker/input', { op: 'drag', x1: cx, y1: y1, x2: cx, y2: y2, duration: 240 });
        setMsg('已执行手势: 向下划动 (' + cx + ',' + y1 + ' → ' + cx + ',' + y2 + ')');
      }
      await refreshStatus();
    }

    async function doLike() {
      setMsg('正在双击点赞...');
      var s = await getScreen();
      var cx = Math.floor(s.width / 2);
      var cy = Math.floor(s.height / 2);
      if (s.width >= s.height) {
        try { await req('/api/hydro/worker/input', { op: 'key', key: 'z' }); } catch (e) {}
      }
      await req('/api/hydro/worker/input', { op: 'click', x: cx, y: cy, count: 2 });
      setMsg('已在屏幕中心 (' + cx + ', ' + cy + ') 双击点赞 ❤️');
      await refreshStatus();
    }

    async function doToggle() {
      setMsg('正在切换播放/暂停...');
      var s = await getScreen();
      var cx = Math.floor(s.width / 2);
      var cy = Math.floor(s.height / 2);
      if (s.width >= s.height) {
        await req('/api/hydro/worker/input', { op: 'key', key: 'space' });
        setMsg('已发送空格键: 播放 / 暂停');
      } else {
        await req('/api/hydro/worker/input', { op: 'click', x: cx, y: cy, count: 1 });
        setMsg('已在屏幕中心 (' + cx + ', ' + cy + ') 单击');
      }
      await refreshStatus();
    }

    async function doKey(k, name) {
      setMsg('正在发送按键: ' + name + '...');
      await req('/api/hydro/worker/input', { op: 'key', key: k });
      setMsg('已发送按键: ' + name);
      await refreshStatus();
    }

    document.getElementById('btnNext').addEventListener('click', function() { doNext().catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnPrev').addEventListener('click', function() { doPrev().catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnLike').addEventListener('click', function() { doLike().catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnToggle').addEventListener('click', function() { doToggle().catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnVolDown').addEventListener('click', function() { doKey('volume_down', '音量 -').catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnVolUp').addEventListener('click', function() { doKey('volume_up', '音量 +').catch(function(e) { setMsg(e.message, true); }); });
    document.getElementById('btnRefreshStatus').addEventListener('click', function() { refreshStatus().catch(function(e) { setMsg(e.message, true); }); });

    refreshStatus();
  </script>
</body>
</html>
