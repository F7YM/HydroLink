<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroLink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-dot" id="serverDot"></div>
        <div>
          <h1>HydroLink</h1>
          <p class="subtitle" id="headerSub">desktop server</p>
        </div>
      </div>
      <span class="version-badge" id="versionBadge">v1.0.0</span>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="status">状态</button>
      <button class="tab" data-tab="pair">配对</button>
      <button class="tab" data-tab="commands">命令</button>
      <button class="tab" data-tab="settings">设置</button>
      <button class="tab" data-tab="logs">日志</button>
    </nav>

    <main>
      <!-- 状态 -->
      <section class="panel" id="tab-status">
        <div class="card">
          <div class="card-title">服务</div>
          <div class="kv"><span>地址</span><b id="stAddr">-</b></div>
          <div class="kv"><span>本机 IP</span><b id="stIp">-</b></div>
          <div class="kv"><span>API 等级</span><b id="stApi">-</b></div>
          <div class="kv"><span>数据目录</span><b class="wrap" id="stDataDir">-</b></div>
        </div>
        <div class="card">
          <div class="card-title">已信任设备 <span class="badge" id="trustedCount">0</span></div>
          <div id="trustedList" class="list"></div>
        </div>
      </section>

      <!-- 配对 -->
      <section class="panel hidden" id="tab-pair">
        <div class="card">
          <div class="card-title">配对请求 <span class="badge" id="pendingCount">0</span></div>
          <div id="pendingList" class="list"><p class="muted">暂无配对请求</p></div>
        </div>
      </section>

      <!-- 配对弹窗 -->
      <div class="modal hidden" id="pairModal">
        <div class="modal-card">
          <div class="modal-title">配对请求</div>
          <p class="modal-text" id="pairModalText">-</p>
          <div class="modal-actions">
            <button class="ghost" id="pairModalReject">拒绝</button>
            <button class="ok" id="pairModalAccept">接受</button>
          </div>
        </div>
      </div>

      <!-- 命令 -->
      <section class="panel hidden" id="tab-commands">
        <div class="card">
          <div class="card-title">快速命令 <span class="badge" id="cmdCount">0</span></div>
          <div id="cmdList" class="list"></div>
        </div>
        <div class="card">
          <div class="card-title">添加命令</div>
          <input id="cmdName" type="text" placeholder="名称（如：重启服务）">
          <input id="cmdBody" type="text" placeholder="命令（如：systemctl restart x）">
          <button class="btn primary" id="cmdAdd">添加</button>
        </div>
      </section>

      <!-- 设置 -->
      <section class="panel hidden" id="tab-settings">
        <div class="card">
          <div class="card-title">设置</div>
          <label class="field">
            <span>端口</span>
            <input id="setPort" type="number" min="1" max="65535">
          </label>
          <label class="check-row">
            <input id="setAcceptAll" type="checkbox">
            <span>自动接受所有配对请求（accept_all）</span>
          </label>
          <button class="btn primary" id="setSave">保存</button>
          <p class="muted" id="setMsg"></p>
        </div>
      </section>

      <!-- 日志 -->
      <section class="panel hidden" id="tab-logs">
        <div class="card">
          <div class="card-title">日志</div>
          <div id="logList" class="logs"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
