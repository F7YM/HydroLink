# 与主仓 android/gradle.properties 保持一致：JDK 21、Kotlin 官方风格、堆 4g
# （Compose Desktop + CEF 一起起来内存吃得不少，默认堆容易 OOM）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.java.home=/usr/lib/jvm/java-21-temurin-jdk
kotlin.code.style=official
# 验证阶段只跑桌面，Android target 先不参与（省一次 AGP 下载）
# 验证阶段只跑桌面；Android target 之后接（要先装 AGP）
